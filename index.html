<style>
:root{--navy:#10223f;--navy2:#172f54;--blue:#2878d0;--cyan:#42c6d5;--ink:#17243a;--muted:#6e7c91;--bg:#f3f6fb;--line:#e3e9f2;--white:#fff;--green:#16845b;--red:#c34b58;--shadow:0 14px 40px rgba(16,34,63,.09)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:258px;background:linear-gradient(180deg,var(--navy),#0b1930);color:white;padding:22px 16px;z-index:20;display:flex;flex-direction:column;transition:.25s}.brand{display:flex;align-items:center;gap:11px;padding:4px 9px 25px}.brand-mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;font-weight:900;color:#09203d;font-size:19px}.brand strong{display:block;font-size:15px;letter-spacing:.8px}.brand small{color:#9fb3ce;font-size:10px;letter-spacing:2px}.nav-label{font-size:10px;color:#8298b6;font-weight:800;letter-spacing:1.5px;padding:12px 12px 8px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c3d0e1;text-align:left;padding:12px;border-radius:10px;display:flex;gap:12px;align-items:center;font-size:13px}.nav button:hover,.nav button.active{background:#ffffff18;color:#fff}.nav .ico{width:20px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;border-top:1px solid #ffffff20;padding:17px 8px 4px;color:#9fb3ce;font-size:11px;line-height:1.6}.main{margin-left:258px;min-height:100vh}.topbar{height:72px;background:#ffffffed;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:10;backdrop-filter:blur(10px)}.top-left{display:flex;align-items:center;gap:14px}.hamb{border:0;background:#edf3fa;border-radius:10px;width:38px;height:38px;font-size:19px;color:var(--navy)}.crumb{font-size:13px;color:var(--muted)}.top-right{display:flex;align-items:center;gap:13px}.avatar{width:36px;height:36px;border-radius:50%;background:#d9eff4;color:#14546a;display:grid;place-items:center;font-weight:800}.user-meta{font-size:12px}.user-meta small{display:block;color:var(--muted);margin-top:2px}.content{padding:30px 34px 55px;max-width:1400px;margin:auto}.welcome{background:linear-gradient(115deg,#10223f,#1b4776 70%,#2878d0);border-radius:20px;padding:30px 32px;color:white;position:relative;overflow:hidden;box-shadow:var(--shadow)}.welcome:after{content:'A+';position:absolute;right:55px;top:-42px;font-size:190px;font-weight:900;color:#ffffff0d;transform:rotate(-12deg)}.eyebrow{font-size:10px;letter-spacing:2px;color:#9de6ed;font-weight:800}.welcome h1{font-size:29px;margin:9px 0}.welcome p{color:#d4e1f0;font-size:13px;max-width:580px;line-height:1.7;margin:0}.section-head{display:flex;align-items:end;justify-content:space-between;margin:28px 0 15px}.section-head h2{font-size:18px;margin:0}.section-head p{font-size:12px;color:var(--muted);margin:5px 0 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.course-card,.panel,.stat{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 18px #152b4a08}.course-card{padding:18px;display:flex;flex-direction:column;min-height:190px}.course-icon{height:42px;width:42px;border-radius:13px;background:#eaf4ff;display:grid;place-items:center;font-size:21px}.course-card h3{font-size:15px;margin:14px 0 5px}.course-card p{font-size:11px;color:var(--muted);line-height:1.55;margin:0 0 15px}.course-card button{margin-top:auto}.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--blue);color:white;font-weight:700;font-size:12px}.btn:hover{filter:brightness(.96)}.btn.secondary{background:#edf3fa;color:var(--navy)}.btn.dark{background:var(--navy)}.btn.danger{background:#fff0f1;color:var(--red)}.btn.small{padding:8px 11px;font-size:11px}.btn:disabled{opacity:.45;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.stat{padding:17px 19px}.stat small{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:7px}.panel{padding:22px;margin-bottom:17px}.panel h2,.panel h3{margin:0 0 14px}.panel h2{font-size:18px}.panel h3{font-size:14px}.muted{color:var(--muted)}.tiny{font-size:11px}.course-tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin:18px 0 20px;overflow:auto}.course-tabs button{border:0;background:none;padding:12px 15px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;font-size:12px;font-weight:700}.course-tabs button.active{color:var(--blue);border-color:var(--blue)}.lesson-list{display:grid;gap:10px}.lesson{border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;gap:13px;align-items:flex-start}.lesson-icon{width:36px;height:36px;border-radius:10px;background:#edf5ff;display:grid;place-items:center;flex-shrink:0}.lesson h4{margin:1px 0 5px;font-size:13px}.lesson p{font-size:11px;color:var(--muted);margin:0;line-height:1.6}.lesson a{font-size:11px;color:var(--blue);display:inline-block;margin-top:7px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:800;color:#506078}.field input,.field textarea,.field select{width:100%;border:1px solid #dce4ef;border-radius:9px;padding:11px 12px;background:#fff;color:var(--ink);outline:none;font-size:12px}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2878d015}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.notice{padding:12px 14px;border-radius:10px;background:#eff8fc;color:#24536b;font-size:11px;line-height:1.6}.quiz-q{padding:16px;border:1px solid var(--line);border-radius:12px;margin:12px 0}.quiz-q strong{font-size:13px}.option{display:flex;gap:9px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:9px;margin-top:7px;font-size:12px;cursor:pointer}.option:has(input:checked){border-color:var(--blue);background:#f1f7ff}.result{padding:20px;border-radius:14px;background:#eef8f4;border:1px solid #d1ebdf}.result strong{font-size:30px;color:var(--green)}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}.table th{font-size:10px;color:var(--muted);letter-spacing:.8px}.hidden{display:none!important}.auth-wrap{min-height:100vh;background:radial-gradient(circle at 80% 15%,#2a6190 0,#10223f 43%,#0b1930 100%);display:grid;place-items:center;padding:22px}.auth{width:min(440px,100%);background:white;border-radius:20px;padding:30px;box-shadow:0 25px 80px #0004}.auth .brand{padding:0 0 22px;color:var(--navy)}.auth h1{font-size:22px;margin:5px 0}.auth>p{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 20px}.auth .field{margin:12px 0}.auth .btn{width:100%;padding:12px}.auth-switch{text-align:center;font-size:11px;color:var(--muted);margin-top:16px}.linkbtn{border:0;background:none;color:var(--blue);font-weight:800}.mobile-overlay{display:none}.empty{text-align:center;padding:30px;color:var(--muted);font-size:12px}.pill{display:inline-block;border-radius:99px;padding:5px 9px;background:#edf4fb;color:#42617f;font-size:10px;font-weight:800}.page-title{font-size:22px;margin:0 0 6px}.backline{display:flex;align-items:center;gap:10px;margin-bottom:18px}.progress{height:7px;background:#edf1f6;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:720px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.mobile-overlay.show{display:block;position:fixed;inset:0;background:#07132688;z-index:15}.main{margin-left:0}.topbar{padding:0 16px;height:64px}.content{padding:19px 15px 40px}.welcome{padding:23px 20px}.welcome h1{font-size:23px}.welcome:after{right:0;font-size:130px}.grid{grid-template-columns:1fr 1fr;gap:9px}.course-card{padding:13px;min-height:190px}.course-card h3{font-size:13px}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:19px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.user-meta{display:none}.panel{padding:16px}.section-head{align-items:start;gap:10px}.table{min-width:520px}.table-wrap{overflow:auto}}@media(max-width:390px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
</style></head>
<body><div id="root"></div>
<script>
const KEY='naulangue_techy_v1';
const courses=[
 {id:'basic',name:'Curso Básico',level:'Nível 1',desc:'Comece do zero: alfabeto, cumprimentos e vocabulário essencial.',icon:'🌱'},
 {id:'intermediate',name:'Curso Intermediário',level:'Nível 2',desc:'Construa frases, pratique gramática e desenvolva diálogos.',icon:'📘'},
 {id:'medium',name:'Curso Médio',level:'Nível 3',desc:'Aprofunde os tempos verbais, leitura e comunicação.',icon:'🎓'},
 {id:'advanced',name:'Curso Avançado',level:'Nível 4',desc:'Desenvolva fluência, escrita e comunicação avançada.',icon:'🚀'}
];
const defaultLessons={basic:[['Alphabet and sounds','Aprenda as letras do alfabeto inglês e os seus sons.','text'],['Greetings','Aprenda a cumprimentar e apresentar-se.','text'],['Numbers and colours','Pratique números, cores e vocabulário diário.','text']],intermediate:[['Present and past','Revise o presente e o passado em frases.','text'],['Everyday conversations','Pratique diálogos em situações comuns.','text'],['Vocabulary building','Amplie o vocabulário e a construção de frases.','text']],medium:[['Verb tenses','Estude os principais tempos verbais.','text'],['Reading comprehension','Leia textos e identifique as ideias principais.','text'],['Writing paragraphs','Organize ideias em parágrafos claros.','text']],advanced:[['Conditionals and complex structures','Explore estruturas gramaticais avançadas.','text'],['Fluent discussion','Pratique argumentação e conversação.','text'],['Formal writing','Desenvolva textos formais e profissionais.','text']]};
const sampleQuestions={basic:[['What is the meaning of “Hello”?',['Goodbye','Olá','Please','Thanks'],1],['Which word means “livro”?',['Pen','Book','Table','Door'],1],['How do you say “bom dia”?',['Good morning','Good night','Goodbye','See you'],0],['Choose the correct pronoun: ___ am a student.',['He','They','I','We'],2],['What is the plural of “cat”?',['Cates','Cats','Caties','Cat'],1],['Which number is “five”?',['4','6','5','9'],2],['What colour is the sky on a clear day?',['Green','Blue','Black','Pink'],1],['Complete: She ___ happy.',['am','are','is','be'],2],['What is the opposite of “big”?',['Small','Tall','Long','High'],0],['How do you say “obrigado”?',['Sorry','Please','Thank you','Welcome'],2],['Choose the article: ___ apple.',['A','An','Thee','No'],1],['Which is a greeting?',['Hello','Chair','Window','Pencil'],0],['What is “mother” in Portuguese?',['Irmão','Pai','Mãe','Tia'],2],['Complete: They ___ friends.',['is','am','are','be'],2],['Which word means “água”?',['Fire','Water','Food','Air'],1]],
intermediate:[['Choose the correct sentence.',['She go to school.','She goes to school.','She going school.','She gone school.'],1],['Past tense of “go”.',['Goed','Gone','Went','Going'],2],['Complete: I have lived here ___ 2020.',['for','since','at','on'],1],['Choose the correct question.',['Where you live?','Where do you live?','Where does you live?','Where are live?'],1],['“Beautiful” is a/an…',['Verb','Adjective','Preposition','Pronoun'],1],['Plural of “child”.',['Childs','Children','Childes','Childrens'],1],['Complete: If it rains, we ___ home.',['stay','stayed','stays','staying'],0],['Choose the correct form: He is ___ than me.',['tall','taller','tallest','more tall'],1],['Meaning of “although”.',['Porque','Apesar de','Portanto','Antes'],1],['Complete: They have ___ finished.',['yet','already','still','ever'],1],['Which is a past continuous sentence?',['I was reading.','I read tomorrow.','I reads.','I have read.'],0],['Choose the correct preposition: interested ___ music.',['on','at','in','for'],2],['Opposite of “careful”.',['Helpful','Careless','Useful','Polite'],1],['Reported speech: He said he ___ tired.',['is','was','be','were'],1],['Choose the correct word: There are ___ books.',['much','many','anyone','a little'],1]],
medium:[['Choose the present perfect form.',['I have seen it.','I has saw it.','I seeing it.','I seen it.'],0],['Complete: By next year, I ___ graduate.',['will','will have','have','had'],1],['“Despite” expresses…',['Contrast','Addition','Time','Place'],0],['Choose the passive voice.',['The chef cooked the meal.','The meal was cooked.','The chef is cooking.','The meal cooks chef.'],1],['Which is a linking word for result?',['However','Therefore','Although','Meanwhile'],1],['Complete: She suggested ___ earlier.',['leave','to leave','leaving','left'],2],['Choose the correct conditional.',['If I had time, I would travel.','If I have time, I would travelled.','If I had time, I will travelled.','If I time, travel.'],0],['“Reliable” means…',['Que não se pode confiar','Confiável','Confuso','Distante'],1],['Choose the correct relative pronoun: The person ___ called is here.',['which','who','where','when'],1],['Complete: Neither answer ___ correct.',['are','were','is','be'],2],['Which sentence is formal?',['Hey, what’s up?','I am writing to enquire about…','Gimme the book.','See ya.'],1],['Meaning of “achieve”.',['Alcançar','Esquecer','Desistir','Esconder'],0],['Choose the correct reported question.',['She asked where I lived.','She asked where did I live.','She asked where I live?','She asked where do I live.'],0],['“In addition” indicates…',['Contrast','Addition','Cause','Condition'],1],['Choose the correct spelling.',['Enviroment','Environment','Envirounment','Environement'],1]],
advanced:[['Choose the correct inversion.',['Rarely I have seen this.','Rarely have I seen this.','Rarely I seen have this.','Rarely seen I have this.'],1],['Meaning of “meticulous”.',['Careless','Very careful and precise','Impatient','Uncertain'],1],['Complete: Had I known, I ___ earlier.',['would come','would have come','will come','came'],1],['Which phrase is a concession?',['In spite of','As a result','For example','In order to'],0],['Choose the subjunctive form.',['They insisted that he be present.','They insisted he is present.','They insisted he was be present.','They insisted he being present.'],0],['“Ambiguous” means…',['Clear','Having more than one possible meaning','Brief','Accurate'],1],['Complete: No sooner ___ arrived than it started raining.',['we had','had we','we have','have we'],1],['Which is the most appropriate academic phrase?',['Kids stuff','A lot of things','A significant factor','Super cool'],2],['Choose the correct collocation.',['Make a decision','Do a decision','Build a decision','Take a decisioning'],0],['Meaning of “to scrutinise”.',['To examine carefully','To ignore','To celebrate','To postpone'],0],['Complete: Were it not for your help, I ___ failed.',['will have','would have','had','would'],1],['Which sentence is grammatically correct?',['Each of the students have a book.','Each of the students has a book.','Each students has book.','Each student have books.'],1],['“Notwithstanding” is closest to…',['Despite','Because','Before','Unless'],0],['Choose the correct punctuation.',['However I disagree.','However, I disagree.','However I, disagree.','However; I, disagree.'],1],['A “compelling argument” is…',['An unconvincing argument','A persuasive argument','An irrelevant argument','A short argument'],1]]};
function fresh(){let lessons={};courses.forEach(c=>lessons[c.id]=defaultLessons[c.id].map((x,i)=>({id:c.id+'-'+i,title:x[0],body:x[1],type:'text',url:''})));return {users:[],lessons,questions:sampleQuestions,results:[],published:[],history:[],favorites:[]}}
function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return fresh()}}let db=load(),session=null,view='home',activeCourse='basic',coursePage=1,quizAnswers={},quizSubmitted=false,editingQuiz=false;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function favKey(type,id){return session.email+'|'+type+'|'+id}function isFav(type,id){return db.favorites.includes(favKey(type,id))}function toggleFav(type,id){let k=favKey(type,id);db.favorites=db.favorites.includes(k)?db.favorites.filter(x=>x!==k):[...db.favorites,k];save();render()}function addHistory(label,kind='Página'){if(!session||session.role==='admin')return;db.history.unshift({email:session.email,label,kind,date:new Date().toISOString()});db.history=db.history.slice(0,300);save()}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function userName(){return session?.name||'Estudante'}function course(id){return courses.find(c=>c.id===id)||courses[0]}function root(){return document.getElementById('root')}
function logo(){return `<div class="brand"><div class="brand-mark">N</div><div><strong>NAULANGUE TECHY</strong><small>LEARN • CONNECT • GROW</small></div></div>`}
function auth(mode='login'){if(mode==='forgot'){root().innerHTML=`<div class="auth-wrap"><div class="auth">${logo()}<h1>Recuperar conta</h1><p>Introduza o email e o código de recuperação criado durante a inscrição. Depois poderá definir uma nova palavra-passe.</p><form id="recoverForm"><div class="field"><label>Email da conta</label><input name="email" type="email" required></div><div class="field"><label>Código de recuperação</label><input name="recovery" required minlength="4" placeholder="O seu código secreto"></div><div class="field"><label>Nova palavra-passe</label><input name="password" type="password" required minlength="6"></div><div class="field"><label>Confirmar nova palavra-passe</label><input name="confirm" type="password" required minlength="6"></div><button class="btn">Actualizar palavra-passe</button></form><div class="auth-switch"><button class="linkbtn" id="backLogin">Voltar ao login</button></div><div class="notice">Demonstração local: a recuperação é validada neste navegador. Para enviar códigos reais por email, será necessária a integração com Supabase.</div></div></div>`;document.getElementById('backLogin').onclick=()=>auth('login');document.getElementById('recoverForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),u=db.users.find(x=>x.email===f.get('email').trim().toLowerCase());if(!u||!u.recoveryCode||u.recoveryCode!==f.get('recovery'))return alert('Dados de recuperação incorrectos.');if(f.get('password')!==f.get('confirm'))return alert('As palavras-passe não coincidem.');u.password=f.get('password');save();alert('Palavra-passe actualizada. Já pode iniciar sessão.');auth('login')};return}
root().innerHTML=`<div class="auth-wrap"><div class="auth">${logo()}<h1>${mode==='register'?'Criar conta de estudante':'Bem-vindo de volta'}</h1><p>${mode==='register'?'Inscreva-se gratuitamente e comece a aprender inglês.':'Entre na sua conta para continuar o seu percurso de aprendizagem.'}</p><form id="authForm">${mode==='register'?`<div class="field"><label>Nome completo</label><input name="name" required placeholder="O seu nome"></div>`:''}<div class="field"><label>Email</label><input name="email" type="email" required placeholder="exemplo@email.com"></div><div class="field"><label>Palavra-passe</label><input name="password" type="password" required minlength="6" placeholder="Mínimo de 6 caracteres"></div>${mode==='register'?`<div class="field"><label>Código de recuperação (guarde-o)</label><input name="recovery" required minlength="4" placeholder="Crie uma palavra ou código secreto"><small class="muted">Será necessário para recuperar a sua conta caso esqueça a palavra-passe.</small></div>`:''}<button class="btn" type="submit">${mode==='register'?'Criar conta':'Entrar'}</button></form>${mode==='login'?`<div class="auth-switch"><button class="linkbtn" id="forgotBtn">Esqueceu a palavra-passe?</button></div>`:''}<div class="auth-switch">${mode==='register'?'Já tem conta?':'Ainda não tem conta?'} <button class="linkbtn" id="switchAuth">${mode==='register'?'Iniciar sessão':'Criar conta'}</button></div><div class="auth-switch"><button class="linkbtn" id="adminLogin">Acesso de administrador</button></div></div></div>`;
document.getElementById('switchAuth').onclick=()=>auth(mode==='register'?'login':'register');document.getElementById('adminLogin').onclick=()=>adminAuth();if(mode==='login')document.getElementById('forgotBtn').onclick=()=>auth('forgot');document.getElementById('authForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),email=f.get('email').trim().toLowerCase(),password=f.get('password');if(mode==='register'){if(db.users.some(u=>u.email===email))return alert('Este email já está registado.');let u={name:f.get('name').trim(),email,password,recoveryCode:f.get('recovery'),role:'student',createdAt:new Date().toISOString()};db.users.push(u);save();session=u;showApp()}else{let u=db.users.find(u=>u.email===email&&u.password===password);if(!u)return alert('Email ou palavra-passe incorrectos.');session=u;showApp()}}}
function adminAuth(){root().innerHTML=`<div class="auth-wrap"><div class="auth">${logo()}<h1>Painel de Administração</h1><p>Acesso reservado à equipa de administração.</p><form id="adminForm"><div class="field"><label>Email do administrador</label><input name="email" type="email" required value="admin@naulanguetechy.com"></div><div class="field"><label>Palavra-passe</label><input name="password" type="password" required placeholder="Introduza a palavra-passe"></div><button class="btn">Entrar no painel</button></form><div class="auth-switch"><button class="linkbtn" id="back">Voltar ao início</button></div><div class="notice" style="margin-top:15px">Demonstração local: email <b>admin@naulanguetechy.com</b> e palavra-passe <b>English@123</b>. Altere estas credenciais quando ligar o projecto a um servidor seguro.</div></div></div>`;document.getElementById('back').onclick=()=>auth();document.getElementById('adminForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(f.get('email')==='admin@naulanguetechy.com'&&f.get('password')==='English@123'){session={name:'Administrador',email:f.get('email'),role:'admin'};showApp()}else alert('Credenciais de administrador incorrectas.')}}
function showApp(){view='home';render()}
function shell(content){root().innerHTML=`<div class="app"><aside class="sidebar" id="sidebar">${logo()}<div class="nav-label">MENU PRINCIPAL</div><nav class="nav"><button data-view="home" class="${view==='home'?'active':''}"><span class="ico">⌂</span> Página inicial</button><button data-view="courses" class="${view==='courses'?'active':''}"><span class="ico">▤</span> Cursos</button><button data-view="lessons" class="${view==='lessons'?'active':''}"><span class="ico">▶</span> Área de aulas</button><button data-view="tests" class="${view==='tests'?'active':''}"><span class="ico">☑</span> Área de testes</button><button data-view="favorites" class="${view==='favorites'?'active':''}"><span class="ico">★</span> Favoritos</button><button data-view="history" class="${view==='history'?'active':''}"><span class="ico">◷</span> Histórico</button><button data-view="profile" class="${view==='profile'?'active':''}"><span class="ico">◎</span> Meu perfil</button>${session.role==='admin'?'<div class="nav-label">GESTÃO</div><button data-view="admin" class="'+(view==='admin'?'active':'')+'"><span class="ico">⚙</span> Painel de Admin</button>':''}</nav><div class="side-bottom">NAULANGUE TECHY<br>Plataforma de aprendizagem de inglês<br>© 2026</div></aside><div class="mobile-overlay" id="overlay"></div><main class="main"><header class="topbar"><div class="top-left"><button class="hamb" id="hamb">☰</button><span class="crumb">Academia / ${labelView()}</span></div><div class="top-right"><div class="user-meta"><b>${esc(userName())}</b><small>${session.role==='admin'?'Administrador':'Estudante'}</small></div><div class="avatar">${esc(userName().slice(0,1).toUpperCase())}</div><button class="btn secondary small" id="logout">Sair</button></div></header><section class="content">${content}</section></main></div>`;
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;if(view!=='history'&&view!=='favorites')addHistory(labelView(),'Secção');render();closeMenu()});document.getElementById('hamb').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').onclick=closeMenu;document.getElementById('logout').onclick=()=>{session=null;auth()}}
function closeMenu(){document.getElementById('sidebar')?.classList.remove('open')}
function labelView(){return ({home:'Página inicial',courses:'Cursos',lessons:'Área de aulas',tests:'Área de testes',profile:'Meu perfil',admin:'Administração'})[view]||'Aprendizagem'}
function render(){if(!session)return auth();let c='';if(view==='home')c=homePage();if(view==='courses')c=coursesPage();if(view==='lessons')c=lessonsPage();if(view==='tests')c=testsPage();if(view==='profile')c=profilePage();if(view==='admin')c=session.role==='admin'?adminPage():'<div class="panel">Acesso não autorizado.</div>';shell(c);bindView()}
function homePage(){let n=db.results.filter(r=>r.email===session.email).length;return `<div class="welcome"><div class="eyebrow">WELCOME TO YOUR ENGLISH JOURNEY</div><h1>Olá, ${esc(userName())}! 👋</h1><p>Aprenda inglês ao seu ritmo. Explore os cursos, acompanhe as aulas e teste os seus conhecimentos numa plataforma simples e interactiva.</p></div><div class="section-head"><div><h2>Escolha o seu curso</h2><p>Quatro níveis para acompanhar a sua evolução.</p></div><button class="btn secondary small" data-go="courses">Ver todos</button></div><div class="grid">${courses.map(c=>`<article class="course-card"><div class="course-icon">${c.icon}</div><h3>${c.name}</h3><p>${c.desc}</p><div class="actions"><button class="btn small" data-course="${c.id}">Aceder ao curso →</button><button class="btn secondary small" data-fav-course="${c.id}">${isFav('course',c.id)?'★ Guardado':'☆ Favoritar'}</button></div></article>`).join('')}</div><div class="stats"><div class="stat"><small>Cursos disponíveis</small><strong>04</strong></div><div class="stat"><small>Testes concluídos</small><strong>${n}</strong></div><div class="stat"><small>Tipo de aprendizagem</small><strong style="font-size:17px">Online</strong></div></div>`}
function coursesPage(){return `<div class="section-head"><div><h2>Os nossos cursos</h2><p>Seleccione um nível para consultar as três páginas do curso.</p></div></div><div class="grid">${courses.map(c=>`<article class="course-card"><div class="course-icon">${c.icon}</div><span class="pill">${c.level}</span><h3>${c.name}</h3><p>${c.desc}</p><div class="actions"><button class="btn small" data-course="${c.id}">Abrir curso →</button><button class="btn secondary small" data-fav-course="${c.id}">${isFav('course',c.id)?'★ Guardado':'☆ Favoritar'}</button></div></article>`).join('')}</div>`}
function courseDetail(){let c=course(activeCourse),ls=db.lessons[activeCourse]||[];return `<div class="backline"><button class="btn secondary small" data-go="courses">← Cursos</button><span class="pill">${c.level}</span></div><h1 class="page-title">${c.icon} ${c.name}</h1><p class="muted tiny">${c.desc}</p><button class="btn secondary small" data-fav-course="${c.id}">${isFav('course',c.id)?'★ Remover dos favoritos':'☆ Adicionar aos favoritos'}</button><div class="course-tabs"><button data-page="1" class="${coursePage===1?'active':''}">Página 1 · Introdução</button><button data-page="2" class="${coursePage===2?'active':''}">Página 2 · Aulas</button><button data-page="3" class="${coursePage===3?'active':''}">Página 3 · Prática</button></div>${coursePage===1?`<div class="panel"><h2>Bem-vindo ao ${c.name}</h2><p class="muted" style="font-size:13px;line-height:1.8">Este curso foi organizado para desenvolver progressivamente as suas competências de língua inglesa. Estude os conteúdos, pratique com regularidade e avance para as actividades de avaliação.</p><h3>Objectivos de aprendizagem</h3><ul class="muted tiny" style="line-height:2"><li>Compreender vocabulário e estruturas adequadas ao nível.</li><li>Desenvolver leitura, escrita, escuta e comunicação oral.</li><li>Aplicar o que aprendeu em situações do quotidiano.</li></ul><button class="btn" data-page="2">Começar as aulas →</button></div>`:coursePage===2?`<div class="panel"><h2>Conteúdos e aulas</h2><p class="muted tiny">Aulas publicadas pelo administrador. Abra os materiais para estudar.</p><div class="lesson-list">${ls.length?ls.map(l=>`<article class="lesson"><div class="lesson-icon">${l.type==='video'?'▶':l.type==='image'?'▧':l.type==='document'?'▤':'✎'}</div><div><h4>${esc(l.title)}</h4><p>${esc(l.body)}</p>${l.url?`<a href="${esc(l.url)}" target="_blank" rel="noopener">Abrir ${l.type==='video'?'vídeo':l.type==='document'?'documento':l.type==='image'?'imagem':'material'} ↗</a>`:''}</div></article>`).join(''):'<div class="empty">Ainda não existem aulas publicadas neste curso.</div>'}</div></div>`:`<div class="panel"><h2>Actividades práticas</h2><p class="muted tiny" style="line-height:1.7">Revise as lições, escreva frases próprias, pratique a pronúncia em voz alta e use o teste para verificar os seus conhecimentos.</p><div class="notice">Quando terminar as aulas, faça o teste de 15 perguntas deste nível. O resultado será calculado automaticamente.</div><div class="actions"><button class="btn" data-view="tests" data-quiz="${activeCourse}">Ir para o teste →</button><button class="btn secondary" data-page="2">Rever aulas</button></div></div>`}`}
function lessonsPage(){return `<div class="section-head"><div><h2>Área de aulas</h2><p>Seleccione um curso para abrir os materiais de aprendizagem.</p></div></div><div class="grid">${courses.map(c=>`<article class="course-card"><div class="course-icon">${c.icon}</div><h3>${c.name}</h3><p>${(db.lessons[c.id]||[]).length} conteúdos disponíveis</p><button class="btn small" data-course="${c.id}" data-page="2">Ver aulas →</button></article>`).join('')}</div>`}
function testsPage(){return `<div class="section-head"><div><h2>Área de testes</h2><p>Escolha o curso e responda às 15 questões de escolha múltipla.</p></div></div><div class="grid">${courses.map(c=>`<article class="course-card"><div class="course-icon">☑</div><h3>Teste — ${c.name}</h3><p>15 questões · 4 alternativas · Correcção automática</p><button class="btn small" data-startquiz="${c.id}">Iniciar teste →</button></article>`).join('')}</div><div class="panel" style="margin-top:18px"><h3>Os meus resultados</h3>${myResults().length?`<table class="table"><thead><tr><th>CURSO</th><th>NOTA</th><th>PERCENTAGEM</th><th>DATA</th></tr></thead><tbody>${myResults().map(r=>`<tr><td>${course(r.course).name}</td><td>${r.score}/15</td><td>${r.percent}%</td><td>${new Date(r.date).toLocaleDateString('pt-PT')}</td></tr>`).join('')}</tbody></table>`:'<p class="muted tiny">Ainda não concluiu nenhum teste.</p>'}</div>`}
function myResults(){return db.results.filter(r=>r.email===session.email).slice().reverse()}
function startQuiz(id){activeCourse=id;quizAnswers={};quizSubmitted=false;view='quiz';renderQuiz()}
function renderQuiz(){let qs=db.questions[activeCourse]||[];shell(`<div class="backline"><button class="btn secondary small" data-view="tests">← Voltar aos testes</button><span class="pill">15 questões</span></div><h1 class="page-title">Teste — ${course(activeCourse).name}</h1><p class="muted tiny">Seleccione apenas uma alternativa em cada pergunta. Todas as questões têm o mesmo valor.</p><form id="quizForm">${qs.map((q,i)=>`<div class="quiz-q"><strong>${i+1}. ${esc(q[0])}</strong>${q[1].map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${quizAnswers[i]===j?'checked':''}> <b>${'ABCD'[j]}.</b> ${esc(o)}</label>`).join('')}</div>`).join('')}<div class="actions"><button class="btn" type="submit">Finalizar teste</button><button class="btn secondary" type="button" id="cancelQuiz">Cancelar</button></div></form>`);document.getElementById('quizForm').onsubmit=e=>{e.preventDefault();let missing=qs.findIndex((q,i)=>quizAnswers[i]===undefined);if(missing!==-1){alert('Responda a todas as 15 questões. Falta a questão '+(missing+1)+'.');document.querySelectorAll('.quiz-q')[missing].scrollIntoView({behavior:'smooth'});return}let score=qs.reduce((s,q,i)=>s+(quizAnswers[i]===q[2]?1:0),0);db.results.push({email:session.email,course:activeCourse,score,percent:Math.round(score/15*100),date:new Date().toISOString()});addHistory('Teste concluído — '+course(activeCourse).name,'Avaliação');save();quizSubmitted=true;view='tests';renderResultPage(score)};document.getElementById('quizForm').querySelectorAll('input').forEach(inp=>inp.onchange=()=>quizAnswers[Number(inp.name.slice(1))]=Number(inp.value));document.getElementById('cancelQuiz').onclick=()=>{view='tests';render()}}
function renderResultPage(score){shell(`<div class="panel"><div class="result"><div class="eyebrow" style="color:#16845b">TESTE CONCLUÍDO</div><h2>Resultado — ${course(activeCourse).name}</h2><strong>${score}/15</strong><p>Percentagem: ${Math.round(score/15*100)}%</p><p class="tiny">${score>=12?'Excelente trabalho! Continue a praticar.':score>=8?'Bom esforço. Reveja as aulas e continue a praticar.':'Continue a estudar. Reveja os conteúdos e tente novamente quando estiver preparado.'}</p></div><h3 style="margin-top:22px">Correcção das respostas</h3>${(db.questions[activeCourse]||[]).map((q,i)=>`<div class="quiz-q"><strong>${i+1}. ${esc(q[0])}</strong><p class="tiny">Resposta correcta: <b>${'ABCD'[q[2]]}. ${esc(q[1][q[2]])}</b></p><p class="tiny ${quizAnswers[i]===q[2]?'':'muted'}">A sua resposta: ${'ABCD'[quizAnswers[i]]}. ${esc(q[1][quizAnswers[i]])} ${quizAnswers[i]===q[2]?'✓':'—'}</p></div>`).join('')}<button class="btn" data-view="tests">Voltar à área de testes</button></div>`)}
function quizResult(){return `<div class="panel">Teste concluído. Consulte os resultados na área de testes.</div>`}
function profilePage(){let u=db.users.find(x=>x.email===session.email);return `<div class="section-head"><div><h2>Meu perfil</h2><p>Informações e actividade da sua conta.</p></div></div><div class="panel"><div class="avatar" style="width:55px;height:55px;font-size:22px">${esc(userName()[0].toUpperCase())}</div><h2 style="margin-top:14px">${esc(userName())}</h2><p class="muted tiny">${esc(session.email)}</p><span class="pill">${session.role==='admin'?'Administrador':'Estudante'}</span><div class="stats"><div class="stat"><small>Testes realizados</small><strong>${myResults().length}</strong></div><div class="stat"><small>Melhor pontuação</small><strong>${myResults().length?Math.max(...myResults().map(r=>r.score))+'/15':'—'}</strong></div><div class="stat"><small>Favoritos</small><strong>${db.favorites.filter(x=>x.startsWith(session.email+'|')).length}</strong></div></div><h3 style="margin-top:22px">Segurança da conta</h3><p class="muted tiny">O código de recuperação é usado quando esquecer a palavra-passe.</p><div class="notice">${u&&u.recoveryCode?'Código de recuperação configurado. Guarde-o num local seguro.':'Esta conta antiga ainda não tem código de recuperação. Termine sessão e crie uma nova conta para configurar recuperação.'}</div></div>`}
function favoritesPage(){let keys=db.favorites.filter(x=>x.startsWith(session.email+'|'));let courseIds=keys.filter(x=>x.includes('|course|')).map(x=>x.split('|')[2]);return `<div class="section-head"><div><h2>Os meus favoritos</h2><p>Cursos guardados para consultar mais tarde.</p></div></div>${courseIds.length?`<div class="grid">${courseIds.map(id=>{let c=course(id);return `<article class="course-card"><div class="course-icon">${c.icon}</div><h3>${c.name}</h3><p>${c.desc}</p><div class="actions"><button class="btn small" data-course="${c.id}">Abrir curso</button><button class="btn danger small" data-fav-course="${c.id}">Remover</button></div></article>`}).join('')}</div>`:'<div class="panel empty">Ainda não guardou nenhum curso como favorito. Visite a área de cursos e seleccione ☆ Favoritar.</div>'}`}
function historyPage(){let rows=db.history.filter(x=>x.email===session.email);return `<div class="section-head"><div><h2>Histórico de aprendizagem</h2><p>Consulte as páginas e actividades visitadas recentemente.</p></div><button class="btn danger small" id="clearHistory">Limpar histórico</button></div><div class="panel">${rows.length?rows.map(x=>`<div class="lesson"><div class="lesson-icon">◷</div><div><h4>${esc(x.label)}</h4><p>${esc(x.kind)} · ${new Date(x.date).toLocaleString('pt-PT')}</p></div></div>`).join(''):'<div class="empty">O seu histórico aparecerá aqui à medida que utilizar a plataforma.</div>'}</div>`}
function adminPage(){let total=db.users.length,lessonCount=Object.values(db.lessons).reduce((a,x)=>a+x.length,0);return `<div class="welcome"><div class="eyebrow">ADMINISTRATION CENTER</div><h1>Painel de Administração</h1><p>Publique aulas e materiais, actualize testes e acompanhe a actividade dos estudantes.</p></div><div class="stats"><div class="stat"><small>Estudantes inscritos</small><strong>${total}</strong></div><div class="stat"><small>Aulas publicadas</small><strong>${lessonCount}</strong></div><div class="stat"><small>Testes realizados</small><strong>${db.results.length}</strong></div></div><div class="section-head"><div><h2>Gestão de conteúdos</h2><p>As publicações ficam disponíveis para os estudantes.</p></div></div><div class="panel"><h3>Publicar nova aula ou material</h3><form id="lessonForm" class="form-grid"><div class="field"><label>Curso</label><select name="course">${courses.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div><div class="field"><label>Tipo de conteúdo</label><select name="type"><option value="text">Texto / explicação</option><option value="video">Vídeo (link)</option><option value="image">Imagem (link)</option><option value="document">Documento (link)</option></select></div><div class="field full"><label>Título da aula</label><input name="title" required placeholder="Ex.: Present Simple"></div><div class="field full"><label>Descrição / conteúdo da aula</label><textarea name="body" required placeholder="Escreva a explicação ou orientação para os estudantes..."></textarea></div><div class="field full"><label>Link do vídeo, imagem ou documento (opcional)</label><input name="url" type="url" placeholder="https://..."></div><div class="field full"><button class="btn">Publicar conteúdo</button></div></form></div><div class="panel"><h3>Conteúdos publicados</h3>${courses.map(c=>`<h4 style="font-size:12px;margin:17px 0 8px">${c.name}</h4>${(db.lessons[c.id]||[]).map(l=>`<div class="lesson"><div style="flex:1"><h4>${esc(l.title)}</h4><p>${esc(l.body)}</p><span class="pill">${l.type}</span></div><button class="btn danger small" data-delete-lesson="${c.id}|${l.id}">Eliminar</button></div>`).join('')||'<p class="muted tiny">Sem conteúdos.</p>'}`).join('')}</div><div class="panel"><h3>Gerir testes de avaliação</h3><p class="muted tiny">Cada teste deve conter exactamente 15 questões. Formato: uma questão por linha, com quatro alternativas e índice da resposta correcta (0=A, 1=B, 2=C, 3=D). Pode editar as questões no editor abaixo.</p><div class="field"><label>Curso</label><select id="quizCourse">${courses.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Editor das 15 questões (JSON)</label><textarea id="quizJson" style="min-height:260px;font-family:monospace;font-size:11px"></textarea></div><div class="actions"><button class="btn" id="saveQuiz">Guardar teste</button><button class="btn secondary" id="resetQuiz">Restaurar exemplo</button></div></div><div class="panel"><h3>Estudantes inscritos</h3>${db.users.length?`<table class="table"><thead><tr><th>NOME</th><th>EMAIL</th><th>TESTES</th></tr></thead><tbody>${db.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${db.results.filter(r=>r.email===u.email).length}</td></tr>`).join('')}</tbody></table>`:'<p class="muted tiny">Ainda não existem estudantes inscritos.</p>'}</div><div class="panel"><h3>Resultados dos testes</h3>${db.results.length?`<table class="table"><thead><tr><th>ESTUDANTE</th><th>CURSO</th><th>NOTA</th><th>DATA</th></tr></thead><tbody>${db.results.slice().reverse().map(r=>`<tr><td>${esc(db.users.find(u=>u.email===r.email)?.name||r.email)}</td><td>${course(r.course).name}</td><td>${r.score}/15 (${r.percent}%)</td><td>${new Date(r.date).toLocaleDateString('pt-PT')}</td></tr>`).join('')}</tbody></table>`:'<p class="muted tiny">Ainda não há testes concluídos.</p>'}</div>`}
function bindView(){document.querySelectorAll('[data-fav-course]').forEach(b=>b.onclick=()=>toggleFav('course',b.dataset.favCourse));let clear=document.getElementById('clearHistory');if(clear)clear.onclick=()=>{if(confirm('Limpar o seu histórico?')){db.history=db.history.filter(x=>x.email!==session.email);save();render()}};document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{activeCourse=b.dataset.course;coursePage=Number(b.dataset.page||1);view='detail';renderDetail()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;if(view!=='history'&&view!=='favorites')addHistory(view,'Secção');render()});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{coursePage=Number(b.dataset.page);renderDetail()});document.querySelectorAll('[data-startquiz]').forEach(b=>b.onclick=()=>startQuiz(b.dataset.startquiz));document.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>startQuiz(b.dataset.quiz));document.querySelectorAll('[data-delete-lesson]').forEach(b=>b.onclick=()=>{let [cid,lid]=b.dataset.deleteLesson.split('|');if(confirm('Eliminar este conteúdo?')){db.lessons[cid]=db.lessons[cid].filter(l=>l.id!==lid);save();render()}});if(view==='admin')bindAdmin()}
function renderDetail(){let c=course(activeCourse);view='detail';addHistory(c.name+' — Página '+coursePage,'Curso');shell(courseDetail());document.querySelectorAll('[data-fav-course]').forEach(b=>b.onclick=()=>toggleFav('course',b.dataset.favCourse));document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{coursePage=Number(b.dataset.page);renderDetail()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;if(view!=='history'&&view!=='favorites')addHistory(view,'Secção');render()});}
function bindAdmin(){let form=document.getElementById('lessonForm');if(form)form.onsubmit=e=>{e.preventDefault();let f=new FormData(form),cid=f.get('course');db.lessons[cid].push({id:'l'+Date.now(),title:f.get('title').trim(),body:f.get('body').trim(),type:f.get('type'),url:f.get('url').trim()});save();alert('Conteúdo publicado com sucesso!');render()};let sel=document.getElementById('quizCourse'),area=document.getElementById('quizJson');if(sel&&area){const fill=()=>area.value=JSON.stringify(db.questions[sel.value],null,2);fill();sel.onchange=fill;document.getElementById('saveQuiz').onclick=()=>{try{let q=JSON.parse(area.value);if(!Array.isArray(q)||q.length!==15)throw Error('O teste deve ter exactamente 15 questões.');q.forEach((x,i)=>{if(!Array.isArray(x)||x.length!==3||typeof x[0]!=='string'||!Array.isArray(x[1])||x[1].length!==4||!Number.isInteger(x[2])||x[2]<0||x[2]>3)throw Error('Verifique a estrutura da questão '+(i+1)+'.')});db.questions[sel.value]=q;save();alert('Teste actualizado com sucesso!') }catch(err){alert('Não foi possível guardar: '+err.message)}};document.getElementById('resetQuiz').onclick=()=>{if(confirm('Restaurar as 15 questões de exemplo deste curso?')){db.questions[sel.value]=sampleQuestions[sel.value].map(q=>q.slice());save();fill()}}}}
function render(){if(!session)return auth();if(view==='quiz')return renderQuiz();let c='';if(view==='home')c=homePage();else if(view==='courses')c=coursesPage();else if(view==='lessons')c=lessonsPage();else if(view==='tests')c=testsPage();else if(view==='profile')c=profilePage();else if(view==='favorites')c=favoritesPage();else if(view==='history')c=historyPage();else if(view==='admin')c=session.role==='admin'?adminPage():'<div class="panel">Acesso não autorizado.</div>';else if(view==='detail')return renderDetail();shell(c);bindView()}
auth();
</script></body></html>
